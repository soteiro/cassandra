<div class="h-screen bg-slate-950 text-white overflow-hidden flex flex-col">
  
  <app-header [sidebar]="sidebar"></app-header>
  <div class="flex flex-1 min-h-0">
    @if (sidebar.isOpen()){
      <div (click)="sidebar.close()" 
      class="bg-black/90 w-full h-full z-10 fixed md: hidden">   
      </div>
    }
    <app-sidebar [sidebar]="sidebar" />

    <main class="flex-1 min-w-0 overflow-y-auto p-6">
      <router-outlet />
    </main>
  </div>
</div>
