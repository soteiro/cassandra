<aside
  class="fixed bg-surface inset-y-0 z-50 left-0 w-64 h-full flex flex-col justify-between p-4 border-r border-surface-border -translate-x-full transition-transform duration-300 ease-in-out md:translate-x-0 md:static md:z-auto"
  [class.translate-x-0]="sidebar.isOpen()"
>
  <!-- HEADER / BRAND -->
  <div class="space-y-6">
    <div class="flex items-center justify-between px-2 pt-1">
      <div class="flex items-center gap-3">
        <div
          class="w-9 h-9 rounded-xl flex items-center justify-center text-primary shadow-xs"
        >
          <img src="cassandra.svg" class="w-full h-full" alt="logo" />
        </div>
        <div>
          <h2 class="text-base font-bold text-text-main tracking-tight leading-none">Cassandra</h2>
          <span
            class="text-[10px] uppercase font-semibold tracking-wider text-primary/80 mt-0.5 block"
          >
            Personal HQ
          </span>
        </div>
      </div>

      <!-- BOTÓN CERRAR EN MÓVIL -->
      <button
        type="button"
        (click)="sidebar.close()"
        class="p-1 rounded-lg text-text-muted hover:text-text-main hover:bg-surface-border md:hidden transition-colors cursor-pointer"
        title="Cerrar menú"
      >
        <svg lucideX class="w-4 h-4" />
      </button>
    </div>

    <!-- BUSCAR PROYECTO -->
    <button
      type="button"
      (click)="commandBarService.state.open(); sidebar.close()"
      class="w-full flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-xl text-text-muted hover:text-text-main bg-background hover:bg-surface-border/60 border border-surface-border transition-colors cursor-pointer text-sm"
    >
      <span class="flex items-center gap-3">
        <svg lucideSearch class="w-4 h-4" />
        <span>Buscar proyecto</span>
      </span>
      <span class="text-[10px] font-semibold text-text-muted/70 border border-surface-border rounded px-1.5 py-0.5">⌘ P</span>
    </button>

    <!-- NAVEGACIÓN -->
    <nav class="space-y-1">
      <p class="text-[11px] font-semibold uppercase tracking-wider text-text-muted/60 px-3 pb-1">
        Workspace
      </p>

      <a
        (click)="sidebar.close()"
        routerLink="/home"
        routerLinkActive="bg-primary font-semibold border-primary/30 shadow-xs"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-text-main hover:text-text-main hover:bg-surface-border/60 border border-transparent transition-all text-sm font-medium group cursor-pointer"
      >
        <svg lucideHouse class="w-4 h-4 group-hover:scale-105 transition-transform" />
        <span>Inicio</span>
      </a>

      <a
        (click)="sidebar.close()"
        routerLink="/proyectos"
        routerLinkActive="text-black font-semibold bg-primary  shadow-xs"
        class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-text-main hover:text-text-main hover:bg-surface-border/60 border border-transparent transition-all text-sm font-medium group cursor-pointer"
      >
        <svg lucideFolder class="w-4 h-4 group-hover:scale-105 transition-transform" />
        <span>Proyectos</span>
      </a>
      <a
        (click)="sidebar.close()"
        routerLink="/crm"
        routerLinkActive="bg-primary font-semibold border-primary/30 shadow-xs"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-text-main hover:text-text-main hover:bg-surface-border/60 border border-transparent transition-all text-sm font-medium group cursor-pointer"
      >
        <svg lucideUser class="w-4 h-4 group-hover:scale-105 transition-transform" />
        <span>Crm</span>
      </a>
      <a
        (click)="sidebar.close()"
        routerLink="/finanzas"
        routerLinkActive="bg-primary font-semibold border-primary/30 shadow-xs"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-text-main hover:text-text-main hover:bg-surface-border/60 border border-transparent transition-all text-sm font-medium group cursor-pointer"
      >
        <svg lucideWalletMinimal class="w-4 h-4 group-hover:scale-105 transition-transform" />
        <span>Finanzas</span>
      </a>
    </nav>
  </div>

  <!-- FOOTER / USER & LOGOUT -->
  <div class="border-t border-surface-border pt-4 mt-auto space-y-3">
    <a
      (click)="sidebar.close()"
      routerLink="/docs"
      routerLinkActive="bg-primary font-semibold border-primary/30 shadow-xs"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-text-main hover:text-text-main hover:bg-surface-border/60 border border-transparent transition-all text-sm font-medium group cursor-pointer"
    >
      <svg lucideBookOpen class="w-4 h-4 group-hover:scale-105 transition-transform" />
      <span>API Docs</span>
    </a>
    <!-- LOGOUT BUTTON -->
    <button
      type="button"
      (click)="chau()"
      class="w-full flex items-center justify-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-medium text-text-muted hover:text-danger hover:bg-danger/10 border border-surface-border hover:border-danger/30 transition-all cursor-pointer"
    >
      <svg lucideLogOut class="w-3.5 h-3.5" />
      <span>Cerrar Sesión</span>
    </button>
  </div>
</aside>
