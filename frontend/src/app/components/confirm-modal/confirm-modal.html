@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-xs backdrop-layer transition-opacity"
    (click)="onBackdropClick($event)"
  >
    <div
      class="bg-surface border border-surface-border rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5 animate-in fade-in zoom-in-95 duration-150"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
          @if (variant() === 'danger') {
            <div class="w-10 h-10 rounded-xl bg-danger/15 border border-danger/30 text-danger flex items-center justify-center shrink-0">
              <svg lucideTrash2 class="w-5 h-5" />
            </div>
          } @else if (variant() === 'warning') {
            <div class="w-10 h-10 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-400 flex items-center justify-center shrink-0">
              <svg lucideTriangleAlert class="w-5 h-5" />
            </div>
          }
          <div>
            <h3 class="text-base font-bold text-text-main leading-tight">{{ title() }}</h3>
            <p class="text-xs text-text-muted mt-1 leading-relaxed">{{ message() }}</p>
          </div>
        </div>

        <button
          type="button"
          (click)="onCancel()"
          class="text-text-muted hover:text-text-main p-1 rounded-lg hover:bg-background transition-colors cursor-pointer"
        >
          <svg lucideX class="w-4 h-4" />
        </button>
      </div>

      <div class="flex items-center justify-end gap-3 pt-3 border-t border-surface-border">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="isProcessing()"
          class="px-4 py-2 text-xs font-medium text-text-muted hover:text-text-main bg-background hover:bg-surface-border/60 border border-surface-border rounded-xl transition-colors cursor-pointer disabled:opacity-50"
        >
          {{ cancelText() }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          [disabled]="isProcessing()"
          [class]="variant() === 'danger' ? 'bg-danger/80 hover:bg-danger text-white shadow-danger/20' : 'bg-primary hover:bg-primary/90 text-background'"
          class="px-4 py-2 text-xs font-semibold rounded-xl shadow-lg transition-all cursor-pointer disabled:opacity-50 flex items-center gap-1.5"
        >
          @if (isProcessing()) {
            <span class="animate-spin text-xs">⠋</span>
            <span>Procesando...</span>
          } @else {
            <span>{{ confirmText() }}</span>
          }
        </button>
      </div>
    </div>
  </div>
}
