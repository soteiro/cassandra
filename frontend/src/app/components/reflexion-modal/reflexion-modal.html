@if (isOpen()) {
  <!-- BACKDROP CON BLUR -->
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-background/80 backdrop-blur-sm animate-in fade-in duration-200"
  >
    <!-- MODAL CONTAINER -->
    <div
      class="w-full max-w-lg bg-surface border border-surface-border rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-in zoom-in-95 duration-200"
    >
      <!-- HEADER -->
      <div class="p-5 border-b border-surface-border flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div
            class="w-9 h-9 rounded-xl bg-primary/15 border border-primary/30 text-primary flex items-center justify-center"
          >
            <svg lucidePencil class="w-4 h-4" />
          </div>
          <div>
            <h3 class="text-base font-bold text-text-main">
              Editar Entrada
            </h3>
            <p class="text-xs text-text-muted">
              Modifica el contenido o tipo de esta reflexión
            </p>
          </div>
        </div>

        <button
          type="button"
          (click)="onClose()"
          class="p-1.5 rounded-lg text-text-muted hover:text-text-main hover:bg-surface-border/60 transition-colors cursor-pointer"
        >
          <svg lucideX class="w-4 h-4" />
        </button>
      </div>

      <!-- FORM BODY -->
      <div class="p-5 space-y-4 overflow-y-auto">
        @if (errorMessage()) {
          <div class="p-3 bg-danger/15 border border-danger/30 rounded-xl text-xs text-danger">
            {{ errorMessage() }}
          </div>
        }

        <!-- SELECTOR DE TIPO -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-text-main">
            Tipo de Entrada
          </label>
          <div class="grid grid-cols-3 gap-2">
            <button
              type="button"
              (click)="setTipo('reflexion')"
              [class]="
                'py-2 px-3 rounded-xl text-xs font-medium border flex items-center justify-center gap-1.5 transition-all cursor-pointer ' +
                (tipo() === 'reflexion'
                  ? 'bg-purple-500/20 text-purple-300 border-purple-500/40 shadow-sm'
                  : 'bg-background hover:bg-surface-border text-text-muted border-surface-border')
              "
            >
              <svg lucideBrain class="w-3.5 h-3.5" />
              <span>Reflexión</span>
            </button>

            <button
              type="button"
              (click)="setTipo('memoria')"
              [class]="
                'py-2 px-3 rounded-xl text-xs font-medium border flex items-center justify-center gap-1.5 transition-all cursor-pointer ' +
                (tipo() === 'memoria'
                  ? 'bg-amber-500/20 text-amber-300 border-amber-500/40 shadow-sm'
                  : 'bg-background hover:bg-surface-border text-text-muted border-surface-border')
              "
            >
              <svg lucideSparkles class="w-3.5 h-3.5" />
              <span>Memoria</span>
            </button>

            <button
              type="button"
              (click)="setTipo('evento')"
              [class]="
                'py-2 px-3 rounded-xl text-xs font-medium border flex items-center justify-center gap-1.5 transition-all cursor-pointer ' +
                (tipo() === 'evento'
                  ? 'bg-blue-500/20 text-blue-300 border-blue-500/40 shadow-sm'
                  : 'bg-background hover:bg-surface-border text-text-muted border-surface-border')
              "
            >
              <svg lucideCalendar class="w-3.5 h-3.5" />
              <span>Evento</span>
            </button>
          </div>
        </div>

        <!-- TEXTO -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-text-main">
            Contenido
          </label>
          <textarea
            rows="6"
            [ngModel]="texto()"
            (ngModelChange)="texto.set($event)"
            placeholder="Escribe aquí tu pensamiento, memoria o evento..."
            class="w-full bg-background border border-surface-border focus:border-primary text-text-main placeholder-text-muted/50 rounded-xl p-3 text-xs outline-none transition-colors leading-relaxed"
          ></textarea>
        </div>
      </div>

      <!-- FOOTER ACCIONES -->
      <div class="p-4 bg-background/50 border-t border-surface-border flex items-center justify-end gap-2.5">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 text-xs font-medium text-text-muted hover:text-text-main bg-surface border border-surface-border rounded-xl transition-colors cursor-pointer"
        >
          Cancelar
        </button>

        <button
          type="button"
          [disabled]="isSubmitting() || !texto().trim()"
          (click)="onSubmit()"
          class="bg-primary hover:bg-primary/90 text-background font-semibold px-5 py-2 rounded-xl text-xs shadow-md transition-all cursor-pointer disabled:opacity-50 flex items-center gap-2"
        >
          @if (isSubmitting()) {
            <span class="animate-spin text-xs">⠋</span>
            <span>Guardando...</span>
          } @else {
            <span>Guardar Cambios</span>
          }
        </button>
      </div>
    </div>
  </div>
}
