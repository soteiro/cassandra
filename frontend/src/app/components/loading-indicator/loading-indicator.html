@if (loading.isLoading()) {
  <div class="loading-track" role="progressbar" [attr.aria-label]="loading.label()">
    <div class="loading-fill"></div>
  </div>
}
<div
  role="status"
  aria-live="polite"
  aria-atomic="true"
  class="loading-status"
  [class.is-visible]="loading.isLoading()"
>
  {{ loading.label() }}
</div>
