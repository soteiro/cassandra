<a
  [routerLink]="['/crm/persona', persona().id]"
  class="group block w-full"
>
  <article
    class="p-3.5 sm:p-4 bg-surface border border-surface-border hover:border-primary/40 rounded-2xl transition-all duration-200 hover:shadow-xl hover:shadow-primary/5 hover:-translate-y-0.5 flex items-center justify-between gap-4"
  >
    <!-- IZQUIERDA: AVATAR ROBOHASH + NOMBRE Y ALIAS -->
    <div class="flex items-center gap-3.5 sm:gap-4 min-w-0">
      <!-- AVATAR CONTAINER CON SCALE HOVER -->
      <div
        class="relative w-12 h-12 sm:w-13 sm:h-13 shrink-0 rounded-2xl bg-surface-border/40 border border-surface-border p-1 flex items-center justify-center overflow-hidden group-hover:border-primary/40 group-hover:bg-primary/5 transition-all shadow-inner"
      >
        <img
          [src]="avatarUrl"
          [alt]="'Avatar de ' + persona().nombre"
          loading="lazy"
          class="w-full h-full object-contain filter drop-shadow-xs transition-transform duration-300 group-hover:scale-105"
        />
      </div>

      <!-- DATOS: NOMBRE Y ALIAS -->
      <div class="min-w-0">
        <h3
          class="text-sm sm:text-base font-bold text-text-main group-hover:text-primary transition-colors tracking-tight truncate"
        >
          {{ persona().nombre }}
        </h3>

        <p class="text-xs text-text-muted group-hover:text-text-muted/90 transition-colors truncate mt-0.5">
          {{ persona().alias ? '@' + persona().alias : 'Sin alias' }}
        </p>
      </div>
    </div>

    <!-- DERECHA: LINK INDICATOR CON SCALE / TRANSLATE -->
    <div class="flex items-center gap-2 shrink-0 pr-1">
      <span
        class="text-xs font-semibold text-primary/80 group-hover:text-primary flex items-center gap-1 group-hover:translate-x-1 transition-all"
      >
        <span class="hidden sm:inline">Ver perfil</span>
        <svg lucideArrowRight class="w-4 h-4" />
      </span>
    </div>
  </article>
</a>
