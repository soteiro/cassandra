<header class="h-14 bg-background/95 backdrop-blur-md w-full justify-between items-center px-4 py-2 flex md:hidden border-b border-surface-border/50 sticky top-0 z-30 select-none">
  <a 
    routerLink="/home"
    (click)="sidebar.close()"
    class="flex items-center gap-2.5 cursor-pointer"
  >
    <img
      src="cassandra.svg"
      alt="logo"
      class="w-7 h-7 flex items-center justify-center text-primary shadow-xs"
    />
    <span class="text-base font-bold text-text-main tracking-tight">Cassandra</span>
  </a>
  <div class="flex items-center gap-1">
    <button
      type="button"
      (click)="commandBarService.state.open(); sidebar.close()"
      class="p-2 rounded-xl text-text-muted hover:text-text-main active:bg-surface-border/60 transition-colors cursor-pointer"
      title="Buscar proyecto"
      aria-label="Buscar proyecto"
    >
      <svg lucideSearch class="w-5 h-5" />
    </button>
    <button
      type="button"
      (click)="sidebar.toggle()"
      class="p-2 rounded-xl text-text-muted hover:text-text-main active:bg-surface-border/60 transition-colors cursor-pointer"
      title="Menú"
      aria-label="Menú"
    >
      <svg lucideMenu class="w-5 h-5" />
    </button>
  </div>
</header>
