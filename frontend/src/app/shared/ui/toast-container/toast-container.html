<aside
  class="fixed top-2 right-0 z-9999 flex flex-col gap-2.5 max-w-lg pointer-events-none md:top-2 md:right-2 "
  aria-label="Notificaciones"
  aria-live="polite"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast-item mx-6 pointer-events-auto bg-transparent relative flex items-start gap-3 p-3.5 sm:p-4 rounded-lg border shadow-2xl backdrop-blur-lg overflow-hidden text-text-main transition-all duration-300"
      [class]="getToastCardClass(toast.type)"
      [attr.role]="toast.type === 'error' || toast.type === 'warning' ? 'alert' : 'status'"
    >
      <!-- Icono contextual -->
      <div
        class="flex items-center justify-center p-1.5 rounded-lg border shrink-0"
        [class]="getIconWrapperClass(toast.type)"
      >
        <!-- Lucide SVGs inline keep the global shell independent of the icon components.
             License: /licenses/lucide.txt -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="w-5 h-5"
        >
          @switch (toast.type) {
            @case ('success') {
              <circle cx="12" cy="12" r="10" />
              <path d="m9 12 2 2 4-4" />
            }
            @case ('error') {
              <circle cx="12" cy="12" r="10" />
              <path d="m15 9-6 6" />
              <path d="m9 9 6 6" />
            }
            @case ('warning') {
              <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
              <path d="M12 9v4" />
              <path d="M12 17h.01" />
            }
            @case ('info') {
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4" />
              <path d="M12 8h.01" />
            }
          }
        </svg>
      </div>

      <!-- Contenido textual -->
      <div class="flex-1 min-w-0 pr-1">
        @if (toast.title) {
          <h4 class="text-sm font-semibold text-text-main leading-tight mb-0.5">
            {{ toast.title }}
          </h4>
        }
        <p class="text-xs text-text-muted leading-relaxed wrap-break-words">
          {{ toast.message }}
        </p>

        @if (toast.action) {
          <button
            type="button"
            class="mt-2.5 inline-flex items-center text-xs font-semibold px-2.5 py-1 rounded-md bg-surface-border/80 hover:bg-surface-border text-text-main transition-colors border border-surface-border focus:outline-none focus:ring-2 focus:ring-primary cursor-pointer"
            (click)="handleAction(toast)"
          >
            {{ toast.action.label }}
          </button>
        }
      </div>

      <!-- Botón para cerrar -->
      <button
        type="button"
        class="text-text-muted hover:text-text-main p-1 rounded-lg hover:bg-surface-border/60 transition-colors shrink-0 -mr-1 -mt-1 focus:outline-none focus:ring-2 focus:ring-primary/50 cursor-pointer"
        aria-label="Cerrar notificación"
        (click)="removeToast(toast.id)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="w-4 h-4"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>

      <!-- Barra de progreso de auto-cierre -->
      @if (toast.duration > 0) {
        <div class="absolute bottom-0 left-0 right-0 h-[2.5px] bg-surface-border/40 overflow-hidden">
          <div
            class="toast-progress h-full w-full"
            [class]="getProgressBarClass(toast.type)"
            [style.animationDuration.ms]="toast.duration"
          ></div>
        </div>
      }
    </div>
  }
</aside>
