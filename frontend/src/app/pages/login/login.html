<section class="flex flex-col p-2 gap-6 justify-center items-center min-h-[80vh] md:flex-row md:gap-30 md:items-center md:justify-center">
<section class="flex justify-center items-center w-full max-w-55 md:max-w-sm p-2 md:p-6 rounded-xl backdrop:blur-xl">
    <img src="cassandra.svg" class="w-full p-4"/>
  </section>
  <section>
    <form
      (submit)="onSubmit($event)"
      class="flex flex-col gap-4 w-full max-w-sm p-6 rounded-xl backdrop:blur-xl border border-surface-border shadow-2xl"
    >
      <h2 class="text-2xl font-bold text-center text-text-main">Cassandra Auth</h2>

      <div class="flex flex-col gap-1">
        <label for="login-email" class="text-sm font-medium text-slate-300">Correo Electrónico</label>
        <input
          id="login-email"
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          required
          autofocus
          autocomplete="username"
          class="px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-primary"
          placeholder="usuario@ejemplo.com"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="login-password" class="text-sm font-medium text-slate-300">Contraseña</label>
        <div class="relative">
          <input
            id="login-password"
            [type]="showPassword() ? 'text' : 'password'"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            required
            autocomplete="current-password"
            class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-primary pr-10"
            placeholder="••••••••"
          />
          <button
            type="button"
            (click)="showPassword.set(!showPassword())"
            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors cursor-pointer"
            tabindex="-1"
            [title]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
          >
            @if (showPassword()) {
              <svg lucideEyeOff class="w-4 h-4" />
            } @else {
              <svg lucideEye class="w-4 h-4" />
            }
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="mt-2 py-2 px-4 bg-primary/70 hover:bg-primary text-white font-bold rounded-lg transition-colors"
      >
        Iniciar Sesión
      </button>

      @if (serverConfig.isNative && serverConfig.serverUrl(); as server) {
        <p class="text-[11px] text-center text-text-muted">
          Conectado a <span class="font-mono">{{ server }}</span> ·
          <button type="button" (click)="changeServer()" class="underline hover:text-text-main cursor-pointer">
            Cambiar
          </button>
        </p>
      }
    </form>
  </section>
  
</section>
