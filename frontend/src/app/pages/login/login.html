<section class="flex p-10 flex-col justify-center items-center min-h-[80vh]">
  <section>
    <form
      (submit)="onSubmit($event)"
      class="flex flex-col gap-4 w-full max-w-sm p-6 rounded-xl backdrop:blur-xl bg- border border-surface-border shadow-2xl"
    >
      <h2 class="text-2xl font-bold text-center text-text-main">Cassandra Auth</h2>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-slate-300">Correo Electrónico</label>
        <input
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          required
          autofocus
          class="px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-primary"
          placeholder="usuario@ejemplo.com"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-slate-300">Contraseña</label>
        <input
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
          class="px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none focus:border-primary"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="mt-2 py-2 px-4 bg-primary/70 hover:bg-primary text-white font-bold rounded-lg transition-colors"
      >
        Iniciar Sesión
      </button>
    </form>
  </section>
  <section class="w-full max-w-77">
    @if (errorMessage()) {
      <div class="p-3 mt-4 mtext-sm text-text-main bg-danger/5 border border-danger rounded-lg">
        {{ errorMessage() }}
      </div>
    } 
  </section>
</section>
