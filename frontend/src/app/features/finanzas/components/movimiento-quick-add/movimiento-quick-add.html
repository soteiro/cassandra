<div class="bg-surface border border-surface-border rounded-2xl p-4 shadow-sm space-y-3">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h3 class="text-xs font-bold text-text-main uppercase tracking-wider flex items-center gap-1.5">
      <svg lucidePlus class="w-4 h-4 text-primary-text" />
      <span>Agregar Movimiento Rápido</span>
    </h3>

    <!-- FILTROS POR ESTADO -->
    <div class="grid w-full min-w-0 grid-cols-2 items-center gap-1 text-[11px] bg-background p-1 rounded-xl border border-surface-border sm:flex sm:w-auto sm:max-w-full sm:flex-wrap">
      <button
        type="button"
        (click)="statusFilter.set('all')"
        [class]="statusFilter() === 'all' ? 'bg-surface-border text-text-main font-semibold shadow-xs' : 'text-text-muted hover:text-text-main'"
        class="min-h-11 px-2.5 py-1 rounded-lg transition-colors cursor-pointer sm:min-h-0"
      >
        Todos
      </button>
      <button
        type="button"
        (click)="statusFilter.set('pendientes')"
        [class]="statusFilter() === 'pendientes' ? 'bg-surface-border text-text-main font-semibold shadow-xs' : 'text-text-muted hover:text-text-main'"
        class="min-h-11 px-2.5 py-1 rounded-lg transition-colors cursor-pointer sm:min-h-0"
      >
        Pendientes
      </button>
      <button
        type="button"
        (click)="statusFilter.set('en_proceso')"
        [class]="statusFilter() === 'en_proceso' ? 'bg-warning/20 text-warning-text font-semibold shadow-xs' : 'text-text-muted hover:text-text-main'"
        class="min-h-11 px-2.5 py-1 rounded-lg transition-colors cursor-pointer flex items-center justify-center gap-1 sm:min-h-0"
      >
        <svg lucideClock class="w-3 h-3" />
        <span>En Proceso</span>
      </button>
      <button
        type="button"
        (click)="statusFilter.set('completados')"
        [class]="statusFilter() === 'completados' ? 'bg-positive/20 text-positive-text font-semibold shadow-xs' : 'text-text-muted hover:text-text-main'"
        class="min-h-11 px-2.5 py-1 rounded-lg transition-colors cursor-pointer flex items-center justify-center gap-1 sm:min-h-0"
      >
        <svg lucideCheck class="w-3 h-3" />
        <span>Completados</span>
      </button>
    </div>
  </div>

  <form (ngSubmit)="createQuick()" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-12 gap-2.5 items-center">
    <!-- TIPO (INGRESO / EGRESO) -->
    <div class="md:col-span-2">
      <select
        [ngModel]="quickTipo()"
        (ngModelChange)="quickTipo.set($event)"
        name="quickTipo"
        class="w-full bg-background border border-surface-border focus:border-primary text-text-main rounded-xl px-3 py-2 text-xs outline-none transition-all font-medium cursor-pointer"
      >
        <option value="egreso">Egreso (Gasto)</option>
        <option value="ingreso">Ingreso</option>
      </select>
    </div>

    <!-- CONCEPTO / NOMBRE -->
    <div class="md:col-span-3">
      <input
        type="text"
        [ngModel]="quickNombre()"
        (ngModelChange)="quickNombre.set($event)"
        name="quickNombre"
        placeholder="Concepto (ej. Arriendo, Supermercado)..."
        class="w-full bg-background border border-surface-border focus:border-primary text-text-main placeholder-text-muted/60 rounded-xl px-3 py-2 text-xs outline-none transition-all"
      />
    </div>

    <!-- MONTO CLP -->
    <div class="md:col-span-2">
      <input
        type="number"
        [ngModel]="quickMonto()"
        (ngModelChange)="quickMonto.set($event)"
        name="quickMonto"
        placeholder="Monto CLP (ej. 135000)"
        class="w-full bg-background border border-surface-border focus:border-primary text-text-main placeholder-text-muted/60 rounded-xl px-3 py-2 text-xs outline-none transition-all font-mono"
      />
    </div>

    <!-- BANCO / CUENTA -->
    <div class="md:col-span-2">
      <select
        [ngModel]="quickBancoId()"
        (ngModelChange)="quickBancoId.set($event)"
        name="quickBancoId"
        class="w-full bg-background border border-surface-border focus:border-primary text-text-main rounded-xl px-3 py-2 text-xs outline-none transition-all cursor-pointer"
      >
        <option [ngValue]="null">Cuenta (Opcional)</option>
        @for (b of bancos(); track b.id) {
          <option [ngValue]="b.id">{{ b.nombre }}</option>
        }
      </select>
    </div>

    <!-- CATEGORÍA (SOLO SI ES EGRESO) -->
    <div class="md:col-span-2">
      <select
        [disabled]="quickTipo() === 'ingreso'"
        [ngModel]="quickGrupoId()"
        (ngModelChange)="quickGrupoId.set($event)"
        name="quickGrupoId"
        class="w-full bg-background border border-surface-border focus:border-primary text-text-main rounded-xl px-3 py-2 text-xs outline-none transition-all cursor-pointer disabled:opacity-30"
      >
        <option [ngValue]="null">Categoría</option>
        @for (g of grupos(); track g.id) {
          <option [ngValue]="g.id">{{ g.nombre }}</option>
        }
      </select>
    </div>

    <!-- BOTÓN ENTER / GUARDAR -->
    <div class="md:col-span-1">
      <button
        type="submit"
        [disabled]="isSubmittingQuick() || !quickNombre().trim()"
        class="w-full bg-primary/20 hover:bg-primary/30 text-primary-text border border-primary/30 font-medium px-3 py-2 rounded-xl text-xs transition-all disabled:opacity-30 cursor-pointer flex items-center justify-center gap-1"
        title="Guardar ítem"
      >
        <svg lucidePlus class="w-3.5 h-3.5" />
        <span>↵</span>
      </button>
    </div>
  </form>
</div>
