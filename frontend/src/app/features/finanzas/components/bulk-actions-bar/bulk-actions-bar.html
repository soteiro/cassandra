<!-- bottom-12 deja la barra por encima de la navegación inferior en móvil -->
<div class="fixed bottom-12 left-1/2 -translate-x-1/2 z-40 bg-surface/95 backdrop-blur-md border border-primary/40 rounded-2xl p-2.5 px-4 shadow-2xl flex flex-wrap items-center gap-3 text-xs ring-1 ring-primary/20 max-w-2xl w-[92vw] sm:w-auto justify-between sm:justify-center animate-in fade-in slide-in-from-bottom-3 duration-200">
  <!-- CONTADOR Y TOTAL SELECCIONADO -->
  <div class="flex items-center gap-2 text-text-main font-semibold border-r border-surface-border pr-3">
    <span class="w-5 h-5 rounded-full bg-primary/20 text-primary-text flex items-center justify-center text-[10px] font-bold">
      {{ count() }}
    </span>
    <span class="text-xs">
      Total: <strong class="font-mono text-primary-text">{{ formatCLP(total()) }}</strong>
    </span>
  </div>

  <!-- BOTONES RÁPIDOS DE ESTADO EN LOTE -->
  <div class="flex items-center gap-1.5">
    <button
      type="button"
      (click)="estadoChange.emit('completado')"
      [disabled]="processing()"
      class="bg-positive/20 hover:bg-positive/30 text-positive-text border border-positive/40 px-3 py-1.5 rounded-xl font-medium transition-all cursor-pointer flex items-center gap-1.5 disabled:opacity-40"
      title="Marcar todos los seleccionados como completados"
    >
      <svg lucideCheck class="w-3.5 h-3.5 stroke-3" />
      <span class="hidden sm:inline">Completar</span>
    </button>

    <button
      type="button"
      (click)="estadoChange.emit('en proceso')"
      [disabled]="processing()"
      class="bg-warning/20 hover:bg-warning/30 text-warning-text border border-warning/40 px-3 py-1.5 rounded-xl font-medium transition-all cursor-pointer flex items-center gap-1.5 disabled:opacity-40"
      title="Marcar todos los seleccionados como en proceso"
    >
      <svg lucideClock class="w-3.5 h-3.5" />
      <span class="hidden sm:inline">En Proceso</span>
    </button>

    <button
      type="button"
      (click)="estadoChange.emit('pendiente')"
      [disabled]="processing()"
      class="bg-surface-border hover:bg-surface-border/80 text-text-muted hover:text-text-main border border-surface-border px-3 py-1.5 rounded-xl font-medium transition-all cursor-pointer flex items-center gap-1.5 disabled:opacity-40"
      title="Marcar todos los seleccionados como pendientes"
    >
      <span class="w-2 h-2 rounded-full bg-text-muted"></span>
      <span class="hidden sm:inline">Pendiente</span>
    </button>
  </div>

  <!-- ASIGNACIÓN EN LOTE (CATEGORÍA Y BANCO) -->
  <div class="relative flex items-center gap-1.5 border-l border-surface-border pl-3" (click)="$event.stopPropagation()">
    <!-- ASIGNAR CATEGORÍA -->
    <div class="relative">
      <button
        type="button"
        (click)="showBulkCategoryMenu.set(!showBulkCategoryMenu()); showBulkBancoMenu.set(false)"
        class="bg-surface hover:bg-surface-border text-text-main border border-surface-border px-2.5 py-1.5 rounded-xl transition-all cursor-pointer flex items-center gap-1 shadow-2xs"
        title="Asignar categoría en lote"
      >
        <svg lucideTag class="w-3.5 h-3.5 text-accent" />
        <span class="hidden md:inline">Categoría</span>
        <svg lucideChevronDown class="w-3 h-3" />
      </button>

      @if (showBulkCategoryMenu()) {
        <div class="absolute bottom-full mb-2 left-0 w-48 bg-surface border border-surface-border rounded-xl shadow-xl p-1.5 space-y-1 max-h-56 overflow-y-auto z-50">
          <span class="text-[10px] font-bold text-text-muted uppercase px-2 py-1 block border-b border-surface-border pb-1">Asignar categoría</span>
          <button
            type="button"
            (click)="categoriaChange.emit(null)"
            class="w-full text-left px-2.5 py-1.5 text-xs text-text-muted hover:text-text-main hover:bg-surface-border rounded-lg transition-colors cursor-pointer"
          >
            Sin categoría
          </button>
          @for (g of grupos(); track g.id) {
            <button
              type="button"
              (click)="categoriaChange.emit(g.id)"
              class="w-full text-left px-2.5 py-1.5 text-xs text-text-main hover:bg-accent/15 hover:text-accent rounded-lg transition-colors truncate cursor-pointer"
            >
              {{ g.nombre }}
            </button>
          }
        </div>
      }
    </div>

    <!-- ASIGNAR CUENTA / BANCO -->
    <div class="relative">
      <button
        type="button"
        (click)="showBulkBancoMenu.set(!showBulkBancoMenu()); showBulkCategoryMenu.set(false)"
        class="bg-surface hover:bg-surface-border text-text-main border border-surface-border px-2.5 py-1.5 rounded-xl transition-all cursor-pointer flex items-center gap-1 shadow-2xs"
        title="Asignar cuenta en lote"
      >
        <svg lucideLandmark class="w-3.5 h-3.5 text-primary-text" />
        <span class="hidden md:inline">Cuenta</span>
        <svg lucideChevronDown class="w-3 h-3" />
      </button>

      @if (showBulkBancoMenu()) {
        <div class="absolute bottom-full mb-2 left-0 w-48 bg-surface border border-surface-border rounded-xl shadow-xl p-1.5 space-y-1 max-h-56 overflow-y-auto z-50">
          <span class="text-[10px] font-bold text-text-muted uppercase px-2 py-1 block border-b border-surface-border pb-1">Asignar cuenta</span>
          <button
            type="button"
            (click)="bancoChange.emit(null)"
            class="w-full text-left px-2.5 py-1.5 text-xs text-text-muted hover:text-text-main hover:bg-surface-border rounded-lg transition-colors cursor-pointer"
          >
            Sin cuenta
          </button>
          @for (b of bancos(); track b.id) {
            <button
              type="button"
              (click)="bancoChange.emit(b.id)"
              class="w-full text-left px-2.5 py-1.5 text-xs text-text-main hover:bg-primary/15 hover:text-primary-text rounded-lg transition-colors truncate cursor-pointer"
            >
              {{ b.nombre }} ({{ b.tipo }})
            </button>
          }
        </div>
      }
    </div>

    <!-- ELIMINAR EN LOTE -->
    <button
      type="button"
      (click)="remove.emit()"
      class="p-1.5 text-text-muted hover:text-danger hover:bg-danger/10 rounded-xl transition-colors cursor-pointer"
      title="Eliminar seleccionados"
    >
      <svg lucideTrash2 class="w-4 h-4" />
    </button>

    <!-- CANCELAR SELECCIÓN -->
    <button
      type="button"
      (click)="clear.emit()"
      class="p-1.5 text-text-muted hover:text-text-main hover:bg-surface-border rounded-xl transition-colors cursor-pointer"
      title="Deseleccionar todo"
    >
      <svg lucideX class="w-4 h-4" />
    </button>
  </div>
</div>
