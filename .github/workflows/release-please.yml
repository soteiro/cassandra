name: Release Please

# Mantiene abierto un PR de release con la próxima versión y el CHANGELOG
# (a partir de los commits feat:/fix:). Al mergear ese PR crea el tag vX.Y.Z
# y la GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
