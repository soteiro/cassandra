name: Release Please

# Mantiene abierto un PR de release con la próxima versión y el CHANGELOG
# (a partir de los commits feat:/fix:). Al mergear ese PR crea el tag vX.Y.Z y la
# GitHub Release; entonces se vuelven a pasar los tests y, solo si pasan, se compilan
# y adjuntan el binario del servidor, el APK firmado y SHA256SUMS, y se despliega
# en producción. Un disparo manual con un tag existente recompila y despliega ese tag
# (sirve también para volver a una versión anterior).
on:
  push:
    branches: [main]
  # Recompila y adjunta los assets de una release ya creada (p. ej. si falló el build).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release existente (p. ej. v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tests:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/ci.yml

  build-server:
    name: Binario del servidor (linux-amd64)
    needs: [release-please, tests]
    if: ${{ always() && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # build.sh: docs + Angular + copia a backend/dist + go build con la versión.
      - name: Compilar
        run: bash build.sh
        env:
          VERSION: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
      - run: mv cassandra-app cassandra-app-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: cassandra-app-linux-amd64

  build-android:
    name: APK firmado
    needs: [release-please, tests]
    if: ${{ always() && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # El paquete 'tools' (por defecto en la action) ya no existe en el repositorio de Google.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # Build de Angular con environment.mobile.ts + cap sync android.
      - run: pnpm run mobile:sync
        working-directory: frontend
      - name: Keystore de release
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Compilar APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: frontend/android
        env:
          APP_VERSION: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: mv frontend/android/app/build/outputs/apk/release/app-release.apk cassandra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: cassandra.apk

  publish:
    name: Adjuntar a la release
    needs: [release-please, build-server, build-android]
    if: ${{ always() && needs.build-server.result == 'success' && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum cassandra-app-linux-amd64 cassandra.apk > SHA256SUMS
      - name: Subir assets
        run: gh release upload "$TAG" cassandra-app-linux-amd64 cassandra.apk SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

  deploy-prod:
    name: Deploy a producción
    needs: [release-please, publish]
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server
      - uses: ./.github/actions/ssh-deploy
        with:
          environment: prod
          version: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          binary: cassandra-app-linux-amd64
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
