info:
  name: create interaccion
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/interacciones"
  body:
    type: json
    data: |-
      {
        "persona_id": {{persona_id}},
        "interaccion": "Llamada telefónica para coordinar fecha de entrega"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
