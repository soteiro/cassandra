info:
  name: create interaccion by persona
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/personas/{{persona_id}}/interacciones"
  body:
    type: json
    data: |-
      {
        "interaccion": "Reunión de seguimiento sobre planificación trimestral y entregables"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
