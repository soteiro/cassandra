info:
  name: Create Subtarea
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/api/tareas"
  body:
    type: json
    data: |-
      {
        "nombre": "Nueva Subtarea de Prueba",
        "descripcion": "Descripción de la subtarea",
        "comentario": "Comentario de la subtarea",
        "estado": "En Curso",
        "prioridad": "normal",
        "proyect_id": {{proyecto_id}},
        "tarea_padre_id": {{tarea_padre_id}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
