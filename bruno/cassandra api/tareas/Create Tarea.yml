info:
  name: Create Tarea
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/tareas"
  body:
    type: json
    data: |-
      {
        "nombre": "Nueva Tarea de Prueba",
        "descripcion": "Descripción detallada de la tarea",
        "comentario": "Comentario de la tarea",
        "estado": "Pendiente",
        "prioridad": "alta",
        "proyect_id": {{proyecto_id}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
