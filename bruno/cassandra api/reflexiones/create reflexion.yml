info:
  name: create reflexion
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/reflexiones"
  body:
    type: json
    data: |-
      {
        "reflexion": "Hoy logré enfocarme 2 horas seguidas aplicando la técnica Pomodoro. Noto que tener pocas tareas visuales reduce mi dispersión.",
        "tipo": "reflexion"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
