info:
  name: refresh
  type: http
  seq: 3
http:
  method: POST
  url: '{{base_url}}/api/auth/refresh'
  headers:
    - name: Cookie
      value: refresh_token={{refresh_token}}
  auth: null
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const header = res.getHeader('set-cookie');
          const cookies = Array.isArray(header) ? header.join('; ') : (header || '');
          for (const name of ['access_token', 'refresh_token']) {
            const match = cookies.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]+)'));
            if (match) {
              bru.setEnvVar(name, match[1]);
            }
          }
        }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  El backend lee refresh_token de la cookie y devuelve access_token en Set-Cookie. No recibe JSON.
