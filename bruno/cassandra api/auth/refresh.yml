info:
  name: refresh
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:8080/api/auth/refresh
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status == 200){
          bru.setEnvVar("accessToken", req.body.access_token)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
