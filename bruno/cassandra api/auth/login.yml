info:
  name: login
  type: http
  seq: 1
http:
  method: POST
  url: '{{base_url}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: null
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const header = res.getHeader('set-cookie');
          const cookies = Array.isArray(header) ? header.join('; ') : (header || '');
          for (const name of ['access_token', 'refresh_token']) {
            const match = cookies.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]+)'));
            if (match) {
              bru.setEnvVar(name, match[1]);
            }
          }
        }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Configura email y password (secreta) en el entorno. Guarda los tokens de Set-Cookie solo en memoria.
