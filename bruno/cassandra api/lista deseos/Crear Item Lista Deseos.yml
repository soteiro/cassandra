info:
  name: Crear Item Lista Deseos
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/lista-deseos"
  # gasto_real es opcional; omitirlo o enviar null deja el monto pendiente.
  # Enviar 0 registra un gasto real de cero.
  body:
    type: json
    data: |-
      {
        "nombre": "Monitor Curvo 34''",
        "presupuesto": 350000,
        "valor_estimado": 320000,
        "gasto_real": null,
        "comprado": false,
        "justificacion": "Mejora ergonómica y mayor productividad para desarrollo y enfoque.",
        "grupo_item_finanzas_id": {{grupo_item_id}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
