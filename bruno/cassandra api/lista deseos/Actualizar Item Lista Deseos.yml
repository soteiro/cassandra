info:
  name: Actualizar Item Lista Deseos
  type: http
  seq: 5

http:
  method: PUT
  url: "{{base_url}}/api/lista-deseos/{{deseo_id}}"
  # gasto_real es opcional; omitirlo o enviar null conserva el valor actual.
  # Enviar 0 actualiza el gasto real a cero.
  body:
    type: json
    data: |-
      {
        "nombre": "Monitor Curvo 34''",
        "presupuesto": 350000,
        "valor_estimado": 310000,
        "gasto_real": 310000,
        "comprado": true,
        "justificacion": "Comprado en oferta CyberDay.",
        "grupo_item_finanzas_id": {{grupo_item_id}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
