info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/proyects/{{proyecto_id}}/notas"
  body:
    type: json
    data: |-
      {
        "proyecto_id": {{proyecto_id}},
        "tarea_id": {{tarea_id}},
        "nota": "Cápsula de solución documentada para la tarea #1"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
