info:
  name: update nota
  type: http
  seq: 8

http:
  method: PUT
  url: "{{base_url}}/api/notas/{{nota_id}}"
  body:
    type: json
    data: |-
      {
        "nota": "Nota técnica actualizada desde bruno",
        "tarea_id": {{tarea_id}},
        "clear_tarea_id": false,
        "eliminado": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
