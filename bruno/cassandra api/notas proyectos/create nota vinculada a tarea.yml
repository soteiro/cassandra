info:
  name: create nota vinculada a tarea
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}/api/tareas/{{tarea_id}}/notas"
  body:
    type: json
    data: |-
      {
        "nota": "Cápsula de solución documentada directamente desde la tarea",
        "proyecto_id": {{proyecto_id}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
