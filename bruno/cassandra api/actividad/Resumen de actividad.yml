info:
  name: Resumen de actividad
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/actividad/resumen?desde={{desde}}&hasta={{hasta}}"
  params:
    - name: desde
      value: "{{desde}}"
      type: query
      enabled: true
    - name: hasta
      value: "{{hasta}}"
      type: query
      enabled: true
  body:
    type: none
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
