info:
  name: Actualizar calendario
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/api/calendarios/1"
  body:
    type: json
    data: |-
      {"oculto": true, "disponibilidad": "libera"}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  disponibilidad: ocupa (terapias, citas), libera (colegio: hay tiempo libre mientras ocurre) o contexto (no cambia los huecos).
