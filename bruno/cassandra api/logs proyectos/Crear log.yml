info:
  name: Crear log
  type: http
  seq: 1
http:
  method: POST
  url: '{{base_url}}/api/proyects/{{proyecto_id}}/logs'
  body:
    type: json
    data: |-
      {
        "titulo": "Registro de trabajo",
        "contenido_raw": "Notas en crudo de la sesión de desarrollo."
      }
