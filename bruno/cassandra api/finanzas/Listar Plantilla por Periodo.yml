info:
  name: Listar Plantilla por Periodo
  type: http
  seq: 15

http:
  method: GET
  url: http://localhost:8080/api/finanzas/plantilla?anio=2026&mes=3
  params:
    - name: anio
      value: "2026"
      type: query
      enabled: true
    - name: mes
      value: "3"
      type: query
      enabled: true
  body:
    type: none
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
