info:
  name: Clonar Periodo
  type: http
  seq: 20

http:
  method: POST
  url: "{{base_url}}/api/finanzas/clonar"
  body:
    type: json
    data: |-
      {
        "anio_origen": {{anio}},
        "mes_origen": {{mes}},
        "anio_destino": {{anio_destino}},
        "mes_destino": {{mes_destino}}
        
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
