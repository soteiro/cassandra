info:
  name: Crear Egreso
  type: http
  seq: 14

http:
  method: POST
  url: "{{base_url}}/api/finanzas/plantilla"
  body:
    type: json
    data: |-
      {
        "tipo": "egreso",
        "mes": {{mes}},
        "anio": {{anio}},
        "nombre": "Arriendo",
        "monto": 135000,
        "banco_id": {{banco_id}},
        "grupo_item_id": {{grupo_item_id}},
        "movimiento_esperado_id": {{movimiento_esperado_id}},
        "estado": "pendiente"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
