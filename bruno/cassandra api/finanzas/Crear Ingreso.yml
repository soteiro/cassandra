info:
  name: Crear Ingreso
  type: http
  seq: 13

http:
  method: POST
  url: "{{base_url}}/api/finanzas/plantilla"
  body:
    type: json
    data: |-
      {
        "tipo": "ingreso",
        "mes": {{mes}},
        "anio": {{anio}},
        "nombre": "Sueldo",
        "monto": 600000,
        "banco_id": {{banco_id}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
