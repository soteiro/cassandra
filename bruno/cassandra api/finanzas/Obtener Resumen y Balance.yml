info:
  name: Obtener Resumen y Balance
  type: http
  seq: 19

http:
  method: GET
  url: "{{base_url}}/api/finanzas/resumen?anio={{anio}}&mes={{mes}}"
  params:
    - name: anio
      value: "{{anio}}"
      type: query
      enabled: true
    - name: mes
      value: "{{mes}}"
      type: query
      enabled: true
  body:
    type: none
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
