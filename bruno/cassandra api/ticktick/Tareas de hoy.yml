info:
  name: Tareas de hoy
  type: http
  seq: 3
http:
  method: GET
  url: '{{base_url}}/api/ticktick/tasks/today'
  params:
    - name: time_zone
      value: '{{time_zone}}'
      type: query
      enabled: true
    - name: refresh
      value: 'true'
      type: query
      enabled: false
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Sin date, usa hoy en time_zone. Habilita refresh para solicitar actualización; respeta el intervalo mínimo de 30 segundos.
